name: Build and deploy Next.js app to Azure Web App - khalid-ai-chat

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  AZURE_WEBAPP_NAME: khalid-ai-chat

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build

      - name: Verify standalone server
        run: |
          test -f .next/standalone/server.js
          echo "Standalone server found"

      - name: Prepare standalone deployment
        run: |
          if [ -d public ]; then
            cp -r public .next/standalone/public
          fi

          mkdir -p .next/standalone/.next
          cp -r .next/static .next/standalone/.next/static

      - name: Create deployment ZIP
        run: |
          cd .next/standalone
          zip -r ../../nextjs-app.zip .

      - name: Verify deployment ZIP
        run: |
          test -f nextjs-app.zip
          echo "ZIP created successfully"
          unzip -l nextjs-app.zip | head -30
          unzip -l nextjs-app.zip | grep "server.js"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-app
          path: nextjs-app.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-app
          path: .

      - name: Verify downloaded ZIP
        run: |
          test -f nextjs-app.zip
          unzip -l nextjs-app.zip | grep "server.js"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DC93DDC64476431F9B5A514F6796375B }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8282A7AC3E9741EA94878253C0F6CC9E }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./nextjs-app.zip
          startup-command: node server.js
